serial_bridge:
  ros__parameters:
    port: /dev/ttyACM0
    baud: 500000
    reconnect_period: 2.0
    command_rate: 50.0
    command_timeout: 0.25
    telemetry_timeout: 0.5
    counts_per_rev: 4320.0
    wheel_diameter: 0.0805
    track_width: 0.190
    max_wheel_speed: 0.30
    drive_mode: skid
    linear_sign: 1.0
    angular_sign: 1.0
    publish_odom_tf: false
    odom_frame: odom
    base_frame: base_footprint
    joint_names: [wheel_1_joint, wheel_2_joint, wheel_3_joint, wheel_4_joint]
    reset_on_connect: false
    normal_brake_hold_ms: 1000

safety_supervisor:
  ros__parameters:
    command_input_topic: /cmd_vel
    command_output_topic: /cmd_vel_safe
    scan_topic: /scan
    front_half_angle_deg: 40.0
    stop_distance: 0.25
    slowdown_distance: 0.50
    clear_distance: 0.35
    command_timeout: 0.30
    scan_timeout: 0.50
    stop_on_scan_timeout: true
    latch_on_obstacle: true
    min_turn_scale: 0.30

timed_waypoint_executor:
  ros__parameters:
    input_topic: /waypoint_input
    frame_id: map
    input_coordinate_mode: legacy_x_right_y_forward
    input_distance_unit: mm
    stop_on_failure: true
    server_wait_timeout: 30.0
